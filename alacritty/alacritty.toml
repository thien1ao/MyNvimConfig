[window]
opacity = 0.95

[colors.primary]
background = '#1c1c1c'
foreground = '#c0c0c0'

[colors.cursor]
cursor = '#bdfe58'
text = '#1c1c1c'

[colors.selection]
background = '#303030'
foreground = '#e1e1e1'

[colors.search.matches]
background = '#1bfd9c'
foreground = '#1c1c1c'

[colors.normal]
black = '#1c1c1c'
red = '#dea6a0'
green = '#baffc9'
yellow = '#a89f68'
blue = '#7fa1c3'
magenta = '#b8a1c9'
cyan = '#66b2b2'
white = '#c0c0c0'

[colors.bright]
black = '#585858'
red = '#ffb3ba'
green = '#1bfd9c'
yellow = '#ffffba'
blue = '#a3bfdb'
magenta = '#d4c1e3'
cyan = '#b2d8d8'
white = '#f1f1f1'


[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
